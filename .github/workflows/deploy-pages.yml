name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # 구독 페이지만 배포 — 기존 kyune.kr에서 링크로 연결해 쓰는 독립 페이지
      - name: Assemble subscription-only site
        run: |
          mkdir -p _site/css _site/js
          cp subscribe.html _site/index.html
          cp subscribe.html _site/subscribe.html
          cp css/subscribe.css _site/css/
          cp js/subscribe.js _site/js/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
