<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8d4cc"/><stop offset="1" stop-color="#c6c2b9"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b0aca3"/><stop offset="1" stop-color="#98948a"/></linearGradient>
<radialGradient id="spot" cx="0.38" cy="0.3" r="0.7"><stop offset="0" stop-color="#f2efe8" stop-opacity="0.85"/><stop offset="1" stop-color="#f2efe8" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx="0.5" cy="0.5" r="0.72"><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#1d1a15" stop-opacity="0.3"/></radialGradient>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9b9a96"/><stop offset="0.12" stop-color="#c9c8c4"/><stop offset="0.3" stop-color="#a6a5a1"/><stop offset="0.5" stop-color="#d6d5d1"/><stop offset="0.72" stop-color="#a09f9b"/><stop offset="0.9" stop-color="#bcbbb7"/><stop offset="1" stop-color="#94938f"/></linearGradient>
<linearGradient id="steelIn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d7c78"/><stop offset="0.5" stop-color="#96958f"/><stop offset="1" stop-color="#6f6e6a"/></linearGradient>
<linearGradient id="matte" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#93938f"/><stop offset="0.2" stop-color="#c2c2be"/><stop offset="0.45" stop-color="#d3d3cf"/><stop offset="0.7" stop-color="#adada9"/><stop offset="1" stop-color="#888884"/></linearGradient>
<radialGradient id="orb" cx="0.36" cy="0.28" r="0.95"><stop offset="0" stop-color="#f6f7f8"/><stop offset="0.32" stop-color="#c9ccce"/><stop offset="0.62" stop-color="#8f9397"/><stop offset="1" stop-color="#63676c"/></radialGradient>
<filter id="blurL"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="blurS"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="tex"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.40 0 0 0 0 0.36 0 0 0 0.18 0"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.08 0 0 0 0 0.08 0 0 0 0 0.07 0 0 0 0.06 0"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#wall)"/>
<rect width="1600" height="1000" fill="url(#spot)"/>
<rect y="640" width="1600" height="360" fill="url(#floor)"/>
<rect y="640" width="1600" height="360" filter="url(#tex)" opacity="0.55"/>
