<circle cx="1004" cy="452" r="44" fill="url(#orb)"/>
<ellipse cx="988" cy="430" rx="15" ry="10" fill="#ffffff" opacity="0.8" transform="rotate(-24 988 430)"/>
<rect width="1600" height="1000" fill="url(#vig)"/>
<rect width="1600" height="1000" filter="url(#grain)"/>
</svg>
