<path d="M790 796 L790 540 Q790 496 834 496 L1086 496 Q1130 496 1130 540 L1130 796 L1088 796 L1088 562 Q1088 538 1064 538 L856 538 Q832 538 832 562 L832 796 Z" fill="url(#steel)"/>
