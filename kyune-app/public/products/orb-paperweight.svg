<radialGradient id="spot" cx="0.42" cy="0.3" r="0.8"><stop offset="0" stop-color="#f0ede6" stop-opacity="0.8"/><stop offset="1" stop-color="#f0ede6" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#1f1c17" stop-opacity="0.26"/></radialGradient>
<radialGradient id="orb" cx="0.36" cy="0.28" r="0.95"><stop offset="0" stop-color="#f6f7f8"/><stop offset="0.32" stop-color="#c9ccce"/><stop offset="0.62" stop-color="#8f9397"/><stop offset="0.85" stop-color="#6a6e73"/><stop offset="1" stop-color="#585c61"/></radialGradient>
